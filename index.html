<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BikePro - Fully Unified</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #00b894; --secondary: #0984e3; --dark: #2d3436; --light: #f1f2f6; --danger: #d63031; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; touch-action: manipulation; }
        body { background: var(--light); margin: 0; padding: 10px; text-align: center; }
        
        .header { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 10px; position: relative; }
        .btn { padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; border: none; cursor: pointer; margin-top: 5px; font-size: 1rem; }
        .btn-primary { background: var(--secondary); color: white; }
        .btn-dark { background: var(--dark); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .lang-btn { position: absolute; top: 15px; left: 15px; width: auto; padding: 5px 10px; font-size: 0.7rem; background: var(--dark); color: white; border-radius: 8px; z-index: 10000; }

        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 2px solid #eee; text-align: center; font-size: 1rem; outline: none; }
        label { display: block; text-align: right; margin-bottom: 5px; font-size: 0.8rem; color: #666; font-weight: bold; }
        [dir="ltr"] label { text-align: left; }

        .toggle-container { display: flex; background: #eee; border-radius: 10px; padding: 5px; margin-bottom: 10px; }
        .toggle-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; background: none; transition: 0.3s; }
        .toggle-btn.active-plus { background: var(--primary); color: white; }
        .toggle-btn.active-minus { background: var(--danger); color: white; }

        #activeRentals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .bike-box { background: white; border-radius: 12px; padding: 12px 2px; border-bottom: 4px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .state-expired { border-bottom-color: var(--danger); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:20px; border-radius:25px; width:90%; max-width:400px; }
        
        .grid-select { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .grid-item { background: #f0f0f0; padding: 12px 2px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .grid-item.selected { background: var(--secondary); color: white; }
        .grid-item.disabled { background: #eee; color: #bbb; opacity: 0.5; }
    </style>
</head>
<body>

<button class="btn lang-btn" onclick="toggleLang()" id="langBtn">English</button>

<div class="header">
    <h2 id="txt-main-title">بي برو - سحابي</h2>
    <div id="loginSection">
        <input type="password" id="passCode" placeholder="كلمة السر">
        <button onclick="checkAdmin()" class="btn-dark" id="txt-login-btn">دخول</button>
    </div>
    <div id="adminTools" style="display:none; flex-direction: column; gap: 5px;">
        <button class="btn btn-primary" onclick="openBikeList()" id="txt-list-btn">➕ القائمة (30/60د)</button>
        <button class="btn btn-dark" onclick="openManualModal()" id="txt-manual-btn">⌨️ إضافة يدوية</button>
        <button onclick="location.reload()" style="font-size:0.7rem; color:gray; border:none; background:none;" id="txt-logout">خروج</button>
    </div>
</div>

<input type="text" id="searchInput" placeholder="ابحث عن سيكل..." oninput="renderBikes()" style="margin-bottom:15px;">

<div id="activeRentals"></div>

<div id="manualModal" class="modal">
    <div class="modal-content">
        <h3 id="txt-manual-title">إضافة يدوية</h3>
        <label id="lbl-manual-id">رقم السيكل:</label>
        <input type="text" id="manualId">
        <label id="lbl-manual-time">الوقت (بالدقائق):</label>
        <input type="number" id="manualTime">
        <button onclick="confirmManual()" class="btn btn-primary" id="txt-start-btn">بدأ</button>
        <button class="btn btn-dark" onclick="closeModals()" id="txt-cancel-1">إلغاء</button>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 id="txt-edit-title">تعديل البيانات</h3>
        <input type="hidden" id="editKey">
        <label id="lbl-edit-id">تعديل الرقم:</label>
        <input type="text" id="editId">
        <label id="lbl-edit-mode">اختر العملية:</label>
        <div class="toggle-container">
            <button id="plusBtn" class="toggle-btn active-plus" onclick="setMode('plus')">➕ زيادة</button>
            <button id="minusBtn" class="toggle-btn" onclick="setMode('minus')">➖ نقصان</button>
        </div>
        <label id="lbl-edit-time">عدد الدقائق:</label>
        <input type="number" id="editTimeVal" placeholder="0">
        <button class="btn btn-primary" onclick="saveEdit()" id="txt-save-btn">حفظ</button>
        <button class="btn btn-danger" onclick="deleteBike()" id="txt-delete-btn">حذف</button>
        <button class="btn btn-dark" onclick="closeModals()" id="txt-cancel-2">إلغاء</button>
    </div>
</div>

<div id="bikeModal" class="modal">
    <div class="modal-content">
        <h3 id="txt-list-title">قائمة السياكل</h3>
        <div class="modal-body" style="max-height:300px; overflow-y:auto; margin-bottom:10px;">
            <div class="grid-select" id="bikeGrid"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="startMultiSelect(30)" class="btn btn-primary" style="flex:1;" id="btn-30m">30د</button>
            <button onclick="startMultiSelect(60)" class="btn btn-primary" style="flex:1;" id="btn-60m">60د</button>
        </div>
        <button class="btn btn-dark" onclick="closeModals()" id="txt-cancel-3">إلغاء</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyARmaRrsN2WRdpeXtQScQnu9MYFS8vqVXU",
        authDomain: "bikepro-969da.firebaseapp.com",
        projectId: "bikepro-969da",
        databaseURL: "https://bikepro-969da-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isAdmin = false, currentLang = 'ar', allBikes = {}, serverOffset = 0, currentMode = 'plus', selectedBikes = [];

    const langData = {
        ar: {
            mainTitle: "بي برو - سحابي", login: "دخول", listBtn: "➕ القائمة (30/60د)", manualBtn: "⌨️ إضافة يدوية", logout: "خروج", search: "ابحث عن سيكل...",
            manualTitle: "إضافة يدوية", lblId: "رقم السيكل:", lblTime: "الوقت (بالدقائق):", start: "بدأ", cancel: "إلغاء",
            editTitle: "تعديل البيانات", lblMode: "اختر العملية:", plus: "➕ زيادة", minus: "➖ نقصان", lblEditTime: "عدد الدقائق:", save: "حفظ", delete: "حذف", bike: "سيكل", done: "انتهى", alert: "أدخل البيانات!", btn30: "30د", btn60: "60د"
        },
        en: {
            mainTitle: "BikePro - Cloud", login: "Login", listBtn: "➕ List (30/60m)", manualBtn: "⌨️ Manual Add", logout: "Logout", search: "Search bike...",
            manualTitle: "Manual Add", lblId: "Bike ID:", lblTime: "Time (Minutes):", start: "Start", cancel: "Cancel",
            editTitle: "Edit Details", lblMode: "Select Mode:", plus: "➕ Plus", minus: "➖ Minus", lblEditTime: "Minutes Count:", save: "Save", delete: "Delete", bike: "Bike", done: "Done", alert: "Fill all fields!", btn30: "30m", btn60: "60m"
        }
    };

    db.ref(".info/serverTimeOffset").on("value", (snap) => { serverOffset = snap.val(); });

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
        updateUI();
    }

    function updateUI() {
        const l = langData[currentLang];
        document.getElementById('txt-main-title').innerText = l.mainTitle;
        document.getElementById('txt-login-btn').innerText = l.login;
        document.getElementById('txt-list-btn').innerText = l.listBtn;
        document.getElementById('txt-manual-btn').innerText = l.manualBtn;
        document.getElementById('txt-logout').innerText = l.logout;
        document.getElementById('searchInput').placeholder = l.search;
        document.getElementById('txt-manual-title').innerText = l.manualTitle;
        document.getElementById('lbl-manual-id').innerText = l.lblId;
        document.getElementById('lbl-manual-time').innerText = l.lblTime;
        document.getElementById('txt-start-btn').innerText = l.start;
        document.getElementById('txt-cancel-1').innerText = l.cancel;
        document.getElementById('txt-cancel-2').innerText = l.cancel;
        document.getElementById('txt-cancel-3').innerText = l.cancel;
        document.getElementById('txt-edit-title').innerText = l.editTitle;
        document.getElementById('lbl-edit-id').innerText = l.lblId;
        document.getElementById('lbl-edit-mode').innerText = l.lblMode;
        document.getElementById('lbl-edit-time').innerText = l.lblEditTime;
        document.getElementById('plusBtn').innerText = l.plus;
        document.getElementById('minusBtn').innerText = l.minus;
        document.getElementById('txt-save-btn').innerText = l.save;
        document.getElementById('txt-delete-btn').innerText = l.delete;
        document.getElementById('btn-30m').innerText = l.btn30;
        document.getElementById('btn-60m').innerText = l.btn60;
        document.getElementById('txt-list-title').innerText = l.listBtn;
        renderBikes();
    }

    function checkAdmin() {
        if(document.getElementById('passCode').value === "1234") {
            isAdmin = true;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminTools').style.display = 'flex';
            renderBikes();
        }
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('plusBtn').className = mode === 'plus' ? 'toggle-btn active-plus' : 'toggle-btn';
        document.getElementById('minusBtn').className = mode === 'minus' ? 'toggle-btn active-minus' : 'toggle-btn';
    }

    function openManualModal() {
        document.getElementById('manualId').value = "";
        document.getElementById('manualTime').value = "";
        document.getElementById('manualModal').style.display = 'flex';
    }

    function confirmManual() {
        const id = document.getElementById('manualId').value;
        const mins = parseInt(document.getElementById('manualTime').value);
        if(!id || !mins) return alert(langData[currentLang].alert);
        const now = Date.now() + serverOffset;
        db.ref('rentals').push({ id: id, end: now + (mins * 60000) });
        closeModals();
    }

    function openBikeList() {
        selectedBikes = [];
        const grid = document.getElementById('bikeGrid');
        grid.innerHTML = '';
        const activeIds = Object.values(allBikes).map(b => b.id.toString());
        for(let i=1; i<=200; i++) {
            const item = document.createElement('div');
            const isActive = activeIds.includes(i.toString());
            item.className = isActive ? 'grid-item disabled' : 'grid-item';
            item.innerText = i;
            if (!isActive) {
                item.onclick = function() {
                    this.classList.toggle('selected');
                    const id = i.toString();
                    if(selectedBikes.includes(id)) selectedBikes = selectedBikes.filter(x => x !== id);
                    else selectedBikes.push(id);
                };
            }
            grid.appendChild(item);
        }
        document.getElementById('bikeModal').style.display = 'flex';
    }

    function startMultiSelect(mins) {
        if (selectedBikes.length === 0) return;
        const now = Date.now() + serverOffset;
        selectedBikes.forEach(id => {
            db.ref('rentals').push({ id: id, end: now + (mins * 60000) });
        });
        closeModals();
    }

    db.ref('rentals').on('value', (snapshot) => {
        allBikes = snapshot.val() || {};
        renderBikes();
    });

    function renderBikes() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const area = document.getElementById('activeRentals');
        area.innerHTML = '';
        const now = Date.now() + serverOffset;
        Object.keys(allBikes).forEach(key => {
            const r = allBikes[key];
            if (r.id.toString().toLowerCase().includes(query)) {
                let diff = r.end - now;
                const box = document.createElement('div');
                box.className = `bike-box ${diff <= 0 ? 'state-expired' : ''}`;
                let timeTxt = diff <= 0 ? langData[currentLang].done : Math.ceil(diff/60000) + (currentLang === 'ar' ? 'د' : 'm');
                box.innerHTML = `<div style="font-size:0.6rem">${langData[currentLang].bike}</div><div style="font-weight:900;">${r.id}</div><div style="font-size:0.8rem; color:var(--secondary)">${timeTxt}</div>`;
                if(isAdmin) {
                    box.onclick = () => {
                        document.getElementById('editKey').value = key;
                        document.getElementById('editId').value = r.id;
                        document.getElementById('editTimeVal').value = "";
                        setMode('plus');
                        document.getElementById('editModal').style.display = 'flex';
                    };
                }
                area.appendChild(box);
            }
        });
    }

    function saveEdit() {
        const key = document.getElementById('editKey').value;
        const newId = document.getElementById('editId').value;
        const mins = parseInt(document.getElementById('editTimeVal').value) || 0;
        const finalMins = currentMode === 'plus' ? mins : -mins;
        
        db.ref('rentals/'+key).once('value', s => {
            db.ref('rentals/'+key).update({ 
                id: newId, 
                end: s.val().end + (finalMins * 60000) 
            });
        });
        closeModals();
    }

    function deleteBike() {
        if(confirm(currentLang === 'ar' ? "حذف؟" : "Delete?")) {
            db.ref('rentals/'+document.getElementById('editKey').value).remove();
            closeModals();
        }
    }

    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    setInterval(renderBikes, 10000);
</script>
</body>
</html>
